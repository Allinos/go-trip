# Example nginx site for GoTrip (TLS via certbot). Adjust domains and paths.
# api.gotrip.in  -> Node API (PM2) on 127.0.0.1:3000
# admin.gotrip.in -> static admin panel build (GoTrips_admin_panel/dist)

upstream gotrip_api {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 443 ssl http2;
    server_name api.gotrip.in;
    # ssl_certificate / ssl_certificate_key managed by certbot

    client_max_body_size 10m;          # document & photo uploads (API limit is MAX_UPLOAD_MB)
    gzip on;
    gzip_types application/json text/plain text/css application/javascript;

    location / {
        proxy_pass http://gotrip_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl http2;
    server_name admin.gotrip.in;
    root /var/www/gotrip-admin;         # copy GoTrips_admin_panel/dist here
    index index.html;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri /index.html; }
}

# Public website (GoTrips_website)
server {
    listen 443 ssl http2;
    server_name gotrip.in www.gotrip.in;
    root /var/www/gotrip-website;       # copy GoTrips_website/dist here
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri /index.html; }
}

server {
    listen 80;
    server_name api.gotrip.in admin.gotrip.in gotrip.in www.gotrip.in;
    return 301 https://$host$request_uri;
}
