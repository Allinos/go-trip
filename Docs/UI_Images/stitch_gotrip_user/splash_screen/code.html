<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>RideFlow - Splash Screen</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Theme Configuration -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#ea2a33",
              "background-light": "#f8f6f6",
              "background-dark": "#211111",
            },
            fontFamily: {
              "display": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display bg-background-light dark:bg-background-dark">
<!-- Main Container: Full viewport height to simulate mobile screen -->
<div class="relative flex h-screen w-full flex-col bg-white dark:bg-background-dark overflow-hidden">
<!-- Status Bar Area (iOS Style Mock) -->
<div class="flex items-center justify-between px-8 pt-4 pb-2 w-full text-[#181111] dark:text-white text-xs font-semibold">
<span>9:41</span>
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-sm" data-icon="signal_cellular_4_bar">signal_cellular_4_bar</span>
<span class="material-symbols-outlined text-sm" data-icon="wifi">wifi</span>
<span class="material-symbols-outlined text-sm" data-icon="battery_full">battery_full</span>
</div>
</div>
<!-- Center Content Area -->
<div class="flex flex-1 flex-col items-center justify-center px-4">
<!-- Logo Section -->
<div class="mb-8 flex flex-col items-center">
<!-- Icon: Circular badge with car/route symbol in primary red -->
<div class="flex h-24 w-24 items-center justify-center rounded-2xl bg-primary mb-4 shadow-lg shadow-primary/20">
<span class="material-symbols-outlined text-white text-5xl" data-icon="directions_car">directions_car</span>
</div>
<!-- Brand Name -->
<h1 class="text-[#181111] dark:text-white tracking-tight text-4xl font-bold leading-tight text-center">
                    Ride<span class="text-primary">Flow</span>
</h1>
<!-- Tagline -->
<p class="text-[#4a3a3a] dark:text-gray-400 text-lg font-medium leading-normal mt-2 text-center">
                    Book rides. Travel smart.
                </p>
</div>
<!-- Visual Graphic (Abstracted Flow Lines) -->
<div class="relative w-full max-w-xs h-32 flex items-center justify-center">
<div class="absolute inset-0 bg-gradient-to-r from-transparent via-primary/5 to-transparent rounded-full blur-3xl"></div>
<!-- Abstract "Path" Graphic -->
<div class="w-full h-[2px] bg-gray-100 dark:bg-gray-800 relative overflow-hidden">
<div class="absolute h-full w-1/3 bg-primary rounded-full left-1/4"></div>
</div>
</div>
</div>
<!-- Bottom Section -->
<div class="flex flex-col items-center justify-end pb-16 px-8">
<!-- Progress Bar (Subtle) -->
<div class="w-full max-w-[140px] h-1.5 bg-[#e5dcdc] dark:bg-gray-800 rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full" style="width: 45%;"></div>
</div>
<!-- Footer Branding (Optional/Contextual) -->
<div class="mt-8">
<p class="text-[#8e7a7a] dark:text-gray-500 text-xs font-medium uppercase tracking-[0.2em]">
                    Premium Transit
                </p>
</div>
</div>
<!-- Bottom Home Indicator (iOS style) -->
<div class="absolute bottom-1 left-1/2 -translate-x-1/2 w-32 h-1.5 bg-black/10 dark:bg-white/10 rounded-full"></div>
</div>
</body></html>
